<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-fade-up { animation: fadeUp 0.5s ease-out both; }
        @media (prefers-reduced-motion: reduce) {
            .anim-fade-up { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-white via-blue-200 to-teal-200 flex items-center justify-center py-12 px-4">
    <div class="anim-fade-up w-full max-w-lg bg-white/90 backdrop-blur rounded-2xl shadow-xl shadow-teal-200/50 p-8 border border-blue-100 text-center">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-teal-400 mb-3">Selamat Datang!</h1>
        <p class="text-gray-600">Data kamu berhasil divalidasi dan terkirim. Selamat datang di dashboard.</p>
    </div>
</body>
</html>
