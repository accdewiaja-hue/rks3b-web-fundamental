<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .anim-fade-up { animation: fadeUp 0.5s ease-out both; }
        .anim-shake { animation: shake 0.3s ease-in-out; }
        @media (prefers-reduced-motion: reduce) {
            .anim-fade-up, .anim-shake { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-white via-blue-200 to-teal-200 flex items-center justify-center py-12 px-4">
    <div class="anim-fade-up w-full max-w-lg bg-white/90 backdrop-blur rounded-2xl shadow-xl shadow-teal-200/50 p-8 border border-blue-100">
        <h1 class="text-2xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-teal-400 mb-6">Form Pendaftaran</h1>
        <form id="registerForm" action="dashboard.html" method="get" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p id="error-username" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p id="error-password" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
                <input type="text" id="nama" name="nama" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p id="error-nama" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>
            <div>
                <label for="tanggalLahir" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
                <input type="date" id="tanggalLahir" name="tanggalLahir" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p id="error-tanggalLahir" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>
            <div>
                <label for="alamat" class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <p id="error-alamat" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>
            <div>
                <label for="nomorTelpon" class="block text-sm font-medium text-gray-700 mb-1">Nomor Telepon</label>
                <input type="tel" id="nomorTelpon" name="nomorTelpon" placeholder="6281234567890" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p id="error-nomorTelpon" class="text-red-500 text-sm mt-1 hidden"></p>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-sky-400 to-teal-300 hover:from-sky-500 hover:to-teal-400 text-white font-semibold py-2 rounded-lg transition duration-200 hover:scale-[1.02] active:scale-[0.98]">Daftar</button>
        </form>
    </div>
    <script src="validasi_input.js"></script>
</body>
</html>
